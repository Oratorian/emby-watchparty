name: Validate

on:
  pull_request:
    branches: [main, 3.0-dev]
  push:
    branches: [main, 3.0-dev]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  contracts:
    name: Workflow and generated contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Python tooling
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Validate workflow syntax
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          # Two asset names here were wrong, and both 404'd: actionlint
          # publishes the linux x86-64 build as `linux_amd64`, never
          # `linux_x86_64`, and its checksum file is `actionlint_<version>_
          # checksums.txt`, not a bare `checksums.txt`. This is the first step
          # in the job, so every run failed here and the contract drift,
          # Compose manifest and image tag checks below never ran at all.
          ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          CHECKSUMS="actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          BASE="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSLO "${BASE}/${ARCHIVE}"
          curl -fsSLO "${BASE}/${CHECKSUMS}"
          grep " ${ARCHIVE}$" "${CHECKSUMS}" | sha256sum -c -
          tar -xzf "${ARCHIVE}" actionlint
          # Existing release workflow intentionally remains outside this CI-only change.
          ./actionlint -color -ignore 'SC2016|SC2086'
      - name: Generated contract drift
        run: |
          python scripts/generate_socket_types.py --check
          python scripts/generate_openapi_types.py --check
          python scripts/generate_deployment_artifacts.py --check
          python scripts/validate_trivy_ignores.py
      - name: Compose manifests
        run: |
          docker compose -f docker-compose.yml.example config -q
          docker compose -f deploy/casaos/docker-compose.yml config -q
          docker compose -f deploy/truenas/custom-app.yml config -q
      - name: Deployment image tag resolves
        run: |
          image=$(python -c "import json; s=json.load(open('deploy/schema.json'))['image']; print(s['repository'] + ':' + s['tag'])")
          docker manifest inspect "$image" > /dev/null

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Ruff
        run: |
          python -m ruff check backend scripts tests
          python -m ruff format --check backend scripts tests
      - name: mypy
        run: python -m mypy
      - name: pytest with coverage
        run: >-
          python -m pytest
          --cov=backend --cov=scripts
          --cov-report=term-missing
          --cov-report=xml:coverage/backend.xml
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-coverage
          path: coverage/backend.xml
          retention-days: 14
          if-no-files-found: error

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run type-check
        working-directory: frontend
      - name: Vitest with coverage
        run: npm run test:coverage
        working-directory: frontend
      - run: npm run build-only
        working-directory: frontend
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 14
          if-no-files-found: error
      - name: Upload compiled frontend
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-static
          path: backend/static
          retention-days: 14
          if-no-files-found: error

  browser:
    name: Browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.project }}
        working-directory: frontend
      - name: Playwright
        run: npm run test:e2e -- --project=${{ matrix.project }}
        working-directory: frontend
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-${{ matrix.project }}-failure
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
          if-no-files-found: ignore

  ios-native-hls:
    name: Native HLS (macOS WebKit)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install webkit
        working-directory: frontend
      - name: Playwright native HLS
        run: npm run test:e2e -- --project=ios-webkit
        working-directory: frontend
        env:
          EXPECT_NATIVE_HLS: "1"
      - name: Upload native-HLS diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-hls-failure
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
          if-no-files-found: ignore

  container:
    name: Container runtime and vulnerability gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: emby-watchparty:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start fake Emby and exact container image
        env:
          # The application under test runs in Docker and reaches this over the
          # bridge gateway, not loopback, so the listener has to accept it.
          E2E_FAKE_EMBY_HOST: 0.0.0.0
        run: |
          python scripts/run_fake_emby.py > fake-emby.log 2>&1 &
          docker run --detach --name watchparty-ci --publish 5013:5000 \
            --add-host host.docker.internal:host-gateway \
            --env APP_ENV=development \
            --env EMBY_SERVER_URL=http://host.docker.internal:5012 \
            --env EMBY_API_KEY=e2e-key \
            --env SESSION_SECRET=container-ci-session-secret-at-least-32-characters \
            --env SESSION_COOKIE_SECURE=false \
            emby-watchparty:ci
          for _attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5013/api/health >/dev/null && \
               curl -fsS http://127.0.0.1:5013/api/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs watchparty-ci
          exit 1
      - name: Critical journey against container
        run: npm run test:playback-gate -- --project=chromium
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:5013
      - name: Scan final runtime image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: emby-watchparty:ci
          format: json
          output: trivy.json
          exit-code: "1"
          # Only fixable findings block the build, because a vulnerability with
          # no upstream fix cannot be actioned by failing CI. The reporting
          # step below is what stops that being a silent permanent
          # suppression: it lists exactly what this flag hid.
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library
          trivyignores: .trivyignore.yaml
      - name: Report unfixed vulnerabilities the gate ignores
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: emby-watchparty:ci
          format: table
          # Reports, never blocks. ignore-unfixed on the gate above is a
          # blanket exception that needs no owner and never expires, unlike
          # every entry in .trivyignore.yaml. Printing it keeps the base-image
          # backlog visible so the choice to carry it stays a decision.
          exit-code: "0"
          ignore-unfixed: false
          severity: HIGH,CRITICAL
          vuln-type: os,library
      - name: Capture container diagnostics
        if: always()
        run: docker logs watchparty-ci > container.log 2>&1 || true
      - name: Upload container diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: container-failure
          path: |
            container.log
            fake-emby.log
            trivy.json
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
          if-no-files-found: ignore

  jellyfin:
    name: Jellyfin ${{ matrix.version }} real-server journey
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["10.10.7", "10.11.11"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install Chromium and FFmpeg
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
        working-directory: frontend
      - name: Build application image
        run: docker build --tag emby-watchparty:jellyfin-ci .
      - name: Start real Jellyfin and application
        run: >-
          python scripts/run_jellyfin_ci.py start
          --state "${RUNNER_TEMP}/jellyfin-${{ matrix.version }}/state.json"
          --jellyfin-image "jellyfin/jellyfin:${{ matrix.version }}"
          --network "watchparty-jellyfin-${{ matrix.version }}"
          --jellyfin-name "jellyfin-${{ matrix.version }}"
          --app-name "watchparty-jellyfin-${{ matrix.version }}"
      - name: Chromium login, browse, playback, seek, reconnect, stop
        run: npx playwright test e2e/jellyfin-real.spec.ts --project=chromium
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:5013
      - name: Verify playback and transcode cleanup
        run: >-
          python scripts/run_jellyfin_ci.py verify
          --state "${RUNNER_TEMP}/jellyfin-${{ matrix.version }}/state.json"
      - name: Capture real-server diagnostics
        if: failure()
        run: |
          docker logs "jellyfin-${{ matrix.version }}" > jellyfin-${{ matrix.version }}.log 2>&1 || true
          docker logs "watchparty-jellyfin-${{ matrix.version }}" > watchparty-jellyfin-${{ matrix.version }}.log 2>&1 || true
      - name: Upload real-server diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jellyfin-${{ matrix.version }}-failure
          path: |
            jellyfin-${{ matrix.version }}.log
            watchparty-jellyfin-${{ matrix.version }}.log
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
          if-no-files-found: ignore
      - name: Remove real-server containers and temporary volumes
        if: always()
        run: >-
          python scripts/run_jellyfin_ci.py cleanup
          --state "${RUNNER_TEMP}/jellyfin-${{ matrix.version }}/state.json"

  dependency-review:
    name: Dependency review
    # Also runs on push. Work reaches the integration branches by direct push
    # as often as by PR, and gating this on pull_request alone left those
    # commits with no dependency check at all while ci-gate still went green,
    # because it counts a skipped job as a pass. Skipped on a branch's first
    # push, where there is no previous commit to diff against.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       github.event.before != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head-ref: ${{ github.sha }}

  changed-coverage:
    name: Changed-line coverage
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: backend-coverage
          path: .coverage/backend
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: frontend-coverage
          path: .coverage/frontend
      - name: Select comparison base
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base=$(git rev-parse HEAD^)
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Enforce 80% changed executable lines
        run: >-
          python scripts/check_diff_coverage.py
          --base "${{ steps.base.outputs.sha }}"
          --python-report .coverage/backend/backend.xml
          --frontend-report .coverage/frontend/lcov.info
          --threshold 80

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - contracts
      - backend
      - frontend
      - browser
      - ios-native-hls
      - container
      - jellyfin
      - dependency-review
      - changed-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq .
          # Skipped still counts as a pass, because some jobs are legitimately
          # conditional. Naming them is what stops that being invisible: a gate
          # where every job skipped looks identical to a gate where every job
          # passed, and that is how a check goes missing without anyone
          # noticing it stopped running.
          skipped=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result == "skipped") | .key')
          if [ -n "$skipped" ]; then
            echo "::warning::Checks that did NOT run for this event:"
            echo "$skipped" | while read -r job; do echo "::warning::  skipped: $job"; done
          fi
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
