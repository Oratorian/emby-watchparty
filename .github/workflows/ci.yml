name: Validate

on:
  pull_request:
  push:
    # Validate both the stable line and the 3.0 integration branch.
    branches: [main, 3.0-dev]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          python -m ruff check backend scripts tests
          python -m ruff format --check backend scripts tests
      - name: mypy
        run: python -m mypy
      - name: pytest
        run: python -m pytest
      - name: Deployment artifact drift and Compose validation
        run: |
          python scripts/generate_deployment_artifacts.py --check
          docker compose -f docker-compose.yml.example config -q
          docker compose -f deploy/casaos/docker-compose.yml config -q
          docker compose -f deploy/truenas/custom-app.yml config -q

      # `compose config` never contacts a registry, so it happily validated
      # artifacts pinned to a tag that does not exist. Every documented
      # deployment path then failed at the first `up` with manifest unknown.
      - name: Deployment image tag resolves
        run: |
          IMAGE=$(python -c "import json; s = json.load(open('deploy/schema.json'))['image']; print(s['repository'] + ':' + s['tag'])")
          echo "Resolving $IMAGE"
          docker manifest inspect "$IMAGE" > /dev/null
      - name: Frontend install
        run: npm ci
        working-directory: frontend
      - name: Frontend lint
        run: npm run lint
        working-directory: frontend
      - name: Frontend type-check
        run: npm run type-check
        working-directory: frontend
      - name: Vitest
        run: npm run test:unit
        working-directory: frontend
      - name: Socket schema drift
        shell: bash
        run: |
          generated="$(mktemp -d)"
          python scripts/generate_socket_types.py --output-dir "$generated"
          diff -u backend/socket-events.schema.json "$generated/backend/socket-events.schema.json"
          diff -u frontend/src/types/socket.generated.ts "$generated/frontend/src/types/socket.generated.ts"
      - name: Production build
        run: npm run build-only
        working-directory: frontend
      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - name: Playwright Chromium and iOS WebKit
        run: npm run test:e2e
        working-directory: frontend

  ios-native-hls:
    runs-on: macos-15
    needs: validate
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install webkit
        working-directory: frontend
      - name: Playwright native HLS on macOS WebKit
        run: npm run test:e2e -- --project=ios-webkit
        working-directory: frontend
        env:
          EXPECT_NATIVE_HLS: "1"

  docker:
    runs-on: ubuntu-latest
    needs: [validate, ios-native-hls]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: false
