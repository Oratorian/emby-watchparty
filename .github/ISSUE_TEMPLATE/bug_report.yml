name: Bug Report
description: Report a bug or issue with Emby Watch Party
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below to help us identify and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe what should happen...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Describe what actually happened...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: What version of Emby Watch Party are you running?
      placeholder: "e.g., v1.0.4"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Which browser are you using?
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: true

  - type: input
    id: emby-version
    attributes:
      label: Emby Server Version
      description: What version of Emby Server are you using?
      placeholder: "e.g., 4.8.0.56"
    validations:
      required: false

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      description: |
        How is Emby Watch Party running? This decides more than it looks like it
        should: client addresses, rate-limit buckets and session cookie flags all
        behave differently behind a reverse proxy than they do on a directly
        reachable server.
      options:
        - Docker, directly reachable
        - Docker, behind a reverse proxy (nginx, Caddy, Traefik, NPM)
        - Unraid / CasaOS / Portainer / TrueNAS
        - Bare metal or source install, directly reachable
        - Bare metal or source install, behind a reverse proxy
        - Other
    validations:
      required: true

  - type: input
    id: proxy-settings
    attributes:
      label: BEHIND_PROXY and TRUSTED_PROXY_CIDRS
      description: |
        3.0 and later only, and only if you are behind a proxy. Do not paste your
        whole environment; these two values are enough. If the log contains a
        warning about `X-Forwarded-For` being discarded, please say so.
      placeholder: "e.g. BEHIND_PROXY=true, TRUSTED_PROXY_CIDRS=172.16.0.0/12"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Please copy and paste any relevant log output. This will be automatically formatted into code.
        Check `logs/emby-watchparty.log` for server logs.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (screenshots, network info, etc.)
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have checked the existing issues to make sure this is not a duplicate
          required: true
        - label: I have included all relevant information above
          required: true
