[project]
name = "emby-watchparty"
version = "3.0.0.dev0"
requires-python = ">=3.12,<3.13"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PTH",
    "PT",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "TC",
    "TID",
    "UP",
]
ignore = [
    "ASYNC109", # Public timeout parameters are ordinary API configuration.
    "B008",     # FastAPI dependency declarations require calls in defaults.
    "ISC001",   # Conflicts with formatter-compatible string wrapping.
    "N815",     # Pydantic fields preserve existing camelCase wire contracts.
]

[tool.ruff.lint.per-file-ignores]
"backend/src/client_ip.py" = ["S104"] # Explicit wildcard-address detection.
"backend/src/config.py" = ["S104"] # Supported bind-all deployment default.
"backend/src/routers/*.py" = ["BLE001"] # Route boundaries produce stable HTTP errors.
"backend/src/update_checker.py" = ["BLE001"] # Best-effort external check.
"tests/**/*.py" = [
    "S101", # Assertions are pytest's public interface.
    "S104", # Bind-all fixtures for client-IP and config tests.
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
files = ["backend"]
mypy_path = "typings"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
